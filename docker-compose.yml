services:
  postgres:
    image: postgres:16-alpine
    container_name: odoo_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: odoo_hack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d odoo_hack']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odoo_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/odoo_hack?schema=public
      DIRECT_URL: postgresql://postgres:password@postgres:5432/odoo_hack?schema=public

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: odoo_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - backend
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000
      INTERNAL_API_URL: http://backend:5000

volumes:
  postgres_data:
    driver: local
